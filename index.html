    /* =====================================================================
       [INTERVENIR AQUÍ] Paleta de colores y tipografía
       ===================================================================== */
    :root {
      --color-dorado: #B6812F;       /* Puntos en mapa y acentos principales */
      --color-azul-primario: #24415D;/* Paneles y botones base */
      --color-azul-oscuro: #182838;  /* Fondo profundo y tarjetas */
      --color-azul-apoyo: #3389A3;   /* Detalles, bordes activos y escala */
      --color-texto: #FFFFFF;
      --color-texto-suave: #D7E2EC;
      --font-titulo: "Montserrat", sans-serif;
      --font-cuerpo: "Open Sans", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-cuerpo);
      background-color: var(--color-azul-oscuro);
      color: var(--color-texto);
    }

    .panel {
      pointer-events: auto;
      background: rgba(24, 40, 56, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(51, 137, 163, 0.35);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
    }

    /* Barra superior */
    .topbar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .header-box {
      padding: 10px 15px;
      border-left: 4px solid var(--color-dorado);
    }

    .header-box h1 {
      font-family: var(--font-titulo);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .header-box p {
      font-size: 0.76rem;
      color: var(--color-texto-suave);
    }

    .controls-box {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
    }

    button {
      font-family: var(--font-cuerpo);
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background-color: var(--color-azul-primario);
      color: var(--color-texto);
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    button:hover {
      border-color: var(--color-azul-apoyo);
      background-color: #2b4e70;
    }

    button.active {
      background-color: var(--color-azul-apoyo);
      border-color: #6bc2dc;
      color: #FFFFFF;
    }

    .btn-dorado {
      background-color: var(--color-dorado);
      border-color: #d39b43;
    }

    .btn-dorado:hover {
      background-color: #c88e35;
      border-color: #e4ad54;
    }

    /* Menú ocultable agrupado por categorías */
    .drawer-menu {
      position: absolute;
      top: 74px;
      left: 12px;
      width: 320px;
      max-width: calc(100% - 24px);
      max-height: calc(100% - 140px);
      z-index: 25;
      display: none;
      flex-direction: column;
      overflow: hidden;
      border-top: 3px solid var(--color-azul-apoyo);
    }

    .drawer-menu.open {
      display: flex;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background-color: var(--color-azul-primario);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .drawer-header h2 {
      font-family: var(--font-titulo);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--color-texto-suave);
      font-size: 1.1rem;
      padding: 2px 6px;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
    }

    .drawer-body {
      overflow-y: auto;
      padding: 10px;
    }

    .group-section {
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(36, 65, 93, 0.45);
    }

    .group-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      padding: 9px 12px;
      border: none;
      border-radius: 0;
      background: rgba(36, 65, 93, 0.85);
      font-family: var(--font-titulo);
      font-size: 0.82rem;
    }

    .group-toggle:hover {
      background: rgba(51, 137, 163, 0.35);
    }

    .group-count {
      font-family: var(--font-cuerpo);
      font-size: 0.72rem;
      background: rgba(24, 40, 56, 0.75);
      padding: 2px 7px;
      border-radius: 999px;
      color: var(--color-texto-suave);
    }

    .group-items {
      display: none;
      flex-direction: column;
      padding: 4px;
      gap: 2px;
    }

    .group-section.expanded .group-items {
      display: flex;
    }

    .poi-item-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      font-weight: 400;
      font-size: 0.82rem;
      color: var(--color-texto-suave);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .poi-item-btn::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--color-dorado);
      flex-shrink: 0;
    }

    .poi-item-btn:hover,
    .poi-item-btn.selected {
      background-color: rgba(182, 129, 47, 0.25);
      color: #FFFFFF;
      font-weight: 600;
    }

    /* Tarjeta informativa al seleccionar un punto */
    .info-card {
      position: absolute;
      top: 74px;
      right: 12px;
      width: 300px;
      max-width: calc(100% - 24px);
      z-index: 22;
      padding: 14px 16px;
      display: none;
      border-top: 3px solid var(--color-dorado);
    }

    .info-card.visible {
      display: block;
    }

    .info-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .info-card h2 {
      font-family: var(--font-titulo);
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .info-card-group {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      color: #8fd6ec;
      margin-bottom: 8px;
    }

    .info-card p {
      font-size: 0.83rem;
      line-height: 1.45;
      color: var(--color-texto-suave);
      margin-bottom: 10px;
    }

    .coords-line {
      font-size: 0.73rem;
      color: #a9bfd4;
      font-family: monospace;
    }

    /* Escala gráfica */
    .scale-bar-box {
      position: absolute;
      bottom: 16px;
      left: 12px;
      z-index: 20;
      padding: 8px 12px;
      pointer-events: none;
    }

    .scale-label {
      font-family: var(--font-titulo);
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--color-texto);
      margin-bottom: 5px;
      text-align: center;
    }

    .scale-line-wrap {
      display: flex;
      align-items: center;
    }

    .scale-bar {
      height: 6px;
      width: 110px;
      border-left: 2px solid var(--color-dorado);
      border-right: 2px solid var(--color-dorado);
      border-bottom: 2px solid #FFFFFF;
      background: linear-gradient(
        90deg,
        rgba(51, 137, 163, 0.85) 0%,
        rgba(51, 137, 163, 0.85) 50%,
        rgba(182, 129, 47, 0.85) 50%,
        rgba(182, 129, 47, 0.85) 100%
      );
    }

    /* Ajustes específicos para móviles y tabletas */
    @media (max-width: 680px) {
      .topbar {
        top: 8px;
        left: 8px;
        right: 8px;
        gap: 6px;
      }

      .header-box {
        width: 100%;
        padding: 8px 12px;
      }

      .header-box h1 {
        font-size: 0.92rem;
      }

      .controls-box {
        width: 100%;
        justify-content: space-between;
        padding: 6px 8px;
        gap: 6px;
      }

      .controls-box button {
        flex: 1;
        padding: 8px 8px;
        font-size: 0.78rem;
        text-align: center;
      }

      .drawer-menu {
        top: 118px;
        left: 8px;
        right: 8px;
        width: auto;
        max-height: calc(100% - 185px);
      }

      .info-card {
        top: auto;
        bottom: 64px;
        left: 8px;
        right: 8px;
        width: auto;
        padding: 12px 14px;
      }

      .scale-bar-box {
        bottom: 8px;
        left: 8px;
        padding: 6px 10px;
      }

      .scale-bar {
        width: 90px;
      }
    }
  </style>
</head>

      { name: "Trituracion", group: "tajos", lat: 17.8785250, lon: -99.6874000, description: "" },
      { name: "Antiguo Control Vehicular", group: "infraestructura", lat: 17.8781944, lon: -99.6843056, description: "" },
      { name: "Patio de arranque Tajo Filos", group: "tajos", lat: 17.8757667, lon: -99.6820889, description: "" },
      { name: "Canal Interior", group: "infraestructura", lat: 17.8764611, lon: -99.6950194, description: "" },
      { name: "Paraje Los Cocos", group: "entorno", lat: 17.8480917, lon: -99.7026361, description: "" }
    ];

    // =====================================================================
    // Inicialización del visor CesiumJS
    // =====================================================================
    Cesium.Ion.defaultAccessToken = CESIUM_ION_TOKEN;

    const viewer = new Cesium.Viewer("cesiumContainer", {
      animation: false,
      timeline: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      fullscreenButton: false,
      infoBox: false,
      selectionIndicator: false
    });

    const entitiesByIndex = [];
    const menuButtonsByIndex = [];
    let labelsVisible = true;

    async function initViewer() {
      if (USE_WORLD_TERRAIN && CESIUM_ION_TOKEN !== "PEGA_AQUI_TU_CESIUM_ION_TOKEN") {
        try {
          viewer.terrainProvider = await Cesium.createWorldTerrainAsync();
        } catch (err) {
          console.warn("No se pudo cargar relieve mundial, se usa elipsoide:", err);
        }
      }

      if (ORTHOPHOTO_ASSET_ID > 0 && CESIUM_ION_TOKEN !== "PEGA_AQUI_TU_CESIUM_ION_TOKEN") {
        try {
          const orthoLayer = await Cesium.ImageryLayer.fromProviderAsync(
            Cesium.IonImageryProvider.fromAssetId(ORTHOPHOTO_ASSET_ID)
          );
          viewer.imageryLayers.add(orthoLayer);
        } catch (err) {
          console.error("Error al cargar la ortofoto desde Cesium ion:", err);
        }
      }

      createAllPoiEntities();
      buildGroupedDrawerMenu();
      bindEvents();
      flyToInitialOverview();
      updateScaleBar();
    }

    // Todos los marcadores se despliegan en el mapa desde el inicio con color dorado
    function createAllPoiEntities() {
      POIS.forEach((poi, idx) => {
        const entity = viewer.entities.add({
          name: poi.name,
          position: Cesium.Cartesian3.fromDegrees(poi.lon, poi.lat, 0),
          point: {
            pixelSize: 11,
            color: GOLDEN_MARKER_COLOR,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2,
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
            disableDepthTestDistance: Number.POSITIVE_INFINITY
          },
          label: {
            text: poi.name,
            show: labelsVisible,
            font: "600 13px 'Open Sans', sans-serif",
            fillColor: Cesium.Color.WHITE,
            outlineColor: Cesium.Color.fromCssColorString("#182838"),
            outlineWidth: 3,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -14),
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
            scaleByDistance: new Cesium.NearFarScalar(1500, 1.0, 18000, 0.35),
            translucencyByDistance: new Cesium.NearFarScalar(1500, 1.0, 25000, 0.25),
            disableDepthTestDistance: Number.POSITIVE_INFINITY
          },
          properties: {
            poiIndex: idx
          }
        });

        entitiesByIndex.push(entity);
      });
    }

    // Construye el menú agrupado dentro del cajón ocultable
    function buildGroupedDrawerMenu() {
      const drawerBody = document.getElementById("drawerBody");
      drawerBody.innerHTML = "";

      GROUPS.forEach((group, gIdx) => {
        const items = POIS
          .map((poi, idx) => ({ poi, idx }))
          .filter((entry) => entry.poi.group === group.id);

        if (items.length === 0) return;

        const section = document.createElement("div");
        section.className = gIdx === 0 ? "group-section expanded" : "group-section";

        const toggleBtn = document.createElement("button");
        toggleBtn.className = "group-toggle";
        toggleBtn.innerHTML = `<span>${group.name}</span><span class="group-count">${items.length}</span>`;
        toggleBtn.addEventListener("click", () => {
          section.classList.toggle("expanded");
        });

        const listDiv = document.createElement("div");
        listDiv.className = "group-items";

        items.forEach(({ poi, idx }) => {
          const itemBtn = document.createElement("button");
          itemBtn.className = "poi-item-btn";
          itemBtn.textContent = poi.name;
          itemBtn.addEventListener("click", () => {
            flyToPoi(idx);
            if (window.innerWidth <= 680) {
              setDrawerOpen(false);
            }
          });
          menuButtonsByIndex[idx] = itemBtn;
          listDiv.appendChild(itemBtn);
        });

        section.appendChild(toggleBtn);
        section.appendChild(listDiv);
        drawerBody.appendChild(section);
      });
    }

    const drawerMenu = document.getElementById("drawerMenu");
    const toggleMenuBtn = document.getElementById("toggleMenuBtn");
    const infoCard = document.getElementById("infoCard");
    const cardTitle = document.getElementById("cardTitle");
    const cardGroup = document.getElementById("cardGroup");
    const cardDescription = document.getElementById("cardDescription");
    const cardCoords = document.getElementById("cardCoords");

    function setDrawerOpen(isOpen) {
      drawerMenu.classList.toggle("open", isOpen);
      toggleMenuBtn.setAttribute("aria-expanded", String(isOpen));
    }

    function flyToPoi(idx) {
      const poi = POIS[idx];
      if (!poi) return;

      menuButtonsByIndex.forEach((btn, i) => {
        if (btn) btn.classList.toggle("selected", i === idx);
      });

      const grp = GROUPS.find((g) => g.id === poi.group);
      cardTitle.textContent = poi.name;
      cardGroup.textContent = grp ? grp.name : "";
      cardDescription.textContent = poi.description || "Punto de interés en sitio.";
      cardCoords.textContent = `Lat: ${poi.lat.toFixed(6)} | Lon: ${poi.lon.toFixed(6)}`;
      infoCard.classList.add("visible");

      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(poi.lon, poi.lat, 1200),
        orientation: {
          heading: Cesium.Math.toRadians(0),
          pitch: Cesium.Math.toRadians(-45),
          roll: 0
        },
        duration: 1.1
      });
    }

    // [INTERVENIR AQUÍ] Vista inicial general del recorrido
    function flyToInitialOverview() {
      infoCard.classList.remove("visible");
      menuButtonsByIndex.forEach((btn) => {
        if (btn) btn.classList.remove("selected");
      });
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(-99.682, 17.885, 14500),
        orientation: {
          heading: Cesium.Math.toRadians(0),
          pitch: Cesium.Math.toRadians(-65),
          roll: 0
        },
        duration: 1.1
      });
    }

    // Escala gráfica dinámica basada en el ancho de la barra y la escala en el centro de pantalla
    function updateScaleBar() {
      const scaleBar = document.getElementById("scaleBar");
      const scaleText = document.getElementById("scaleText");
      const barWidthPx = scaleBar.offsetWidth || 110;

      const width = viewer.scene.canvas.clientWidth;
      const height = viewer.scene.canvas.clientHeight;
      if (!width || !height) return;

      const leftRay = viewer.camera.getPickRay(new Cesium.Cartesian2(width * 0.5 - barWidthPx * 0.5, height * 0.5));
      const rightRay = viewer.camera.getPickRay(new Cesium.Cartesian2(width * 0.5 + barWidthPx * 0.5, height * 0.5));

      const pLeft = leftRay ? viewer.scene.globe.pick(leftRay, viewer.scene) : null;
      const pRight = rightRay ? viewer.scene.globe.pick(rightRay, viewer.scene) : null;

      let meters = 0;
      if (pLeft && pRight) {
        meters = Cesium.Cartesian3.distance(pLeft, pRight);
      } else {
        const camHeight = viewer.camera.positionCartographic.height || 10000;
        meters = camHeight * 0.18;
      }

      if (meters >= 1000) {
        scaleText.textContent = `${(meters / 1000).toFixed(meters >= 10000 ? 1 : 2)} km`;
      } else {
        scaleText.textContent = `${Math.round(meters)} m`;
      }
    }

    function bindEvents() {
      toggleMenuBtn.addEventListener("click", () => {
        setDrawerOpen(!drawerMenu.classList.contains("open"));
      });

      document.getElementById("closeDrawerBtn").addEventListener("click", () => {
        setDrawerOpen(false);
      });

      document.getElementById("closeCardBtn").addEventListener("click", () => {
        infoCard.classList.remove("visible");
      });

      document.getElementById("resetViewBtn").addEventListener("click", flyToInitialOverview);

      const labelsBtn = document.getElementById("toggleLabelsBtn");
      labelsBtn.addEventListener("click", () => {
        labelsVisible = !labelsVisible;
        labelsBtn.textContent = labelsVisible ? "Ocultar etiquetas" : "Mostrar etiquetas";
        labelsBtn.classList.toggle("active", labelsVisible);
        entitiesByIndex.forEach((entity) => {
          entity.label.show = labelsVisible;
        });
      });

      viewer.camera.changed.addEventListener(updateScaleBar);
      window.addEventListener("resize", updateScaleBar);

      const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
      handler.setInputAction((movement) => {
        const picked = viewer.scene.pick(movement.position);
        if (Cesium.defined(picked) && picked.id && picked.id.properties) {
          const idx = picked.id.properties.poiIndex.getValue();
          if (typeof idx === "number") {
            flyToPoi(idx);
          }
        }
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    }

    initViewer();
  </script>
</body>
</html>
